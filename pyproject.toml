[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "opentelemetry-exporter-otlp-proto-http>=1.42.1,<2",
    "opentelemetry-sdk>=1.42.1,<2",
    "pyright>=1.1.411",
    "ruff>=0.15.18",
]

[project]
name = "src-py-lib"
dynamic = ["version"]
description = "Reusable libraries for Sourcegraph projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name="Sourcegraph" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "opentelemetry-api>=1.42.1,<2",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
]
keywords = [
    "Sourcegraph"
]

[project.urls]
Homepage = "https://github.com/sourcegraph/src-py-lib"
Issues = "https://github.com/sourcegraph/src-py-lib/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.42.1,<2",
    "opentelemetry-sdk>=1.42.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/src_py_lib"]

[tool.hatch.version]
source = "vcs"

[tool.pyright]
include = ["src/src_py_lib", "tests"]
typeCheckingMode = "strict"
extraPaths = ["src"]
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv]
package = true
